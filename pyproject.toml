[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-esportivo"
version = "1.0.0"
description = "Agente de analise esportiva do Brasileirao: probabilidades, mercados e apostas de valor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
navegador = ["playwright>=1.40"]

[project.scripts]
agente-esportivo = "agente_esportivo.cli:main"

[tool.setuptools]
packages = ["agente_esportivo", "agente_esportivo.coleta"]

[tool.setuptools.package-data]
agente_esportivo = ["py.typed"]
